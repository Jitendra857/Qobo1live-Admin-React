name: Deploy Qobo1live Frontend

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Node.js
      # ------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------
      - name: Install Dependencies
        run: npm ci

      # ------------------------------------------
      # Create production environment
      # ------------------------------------------
      - name: Create Production Environment
        run: |
          echo "VITE_PROD_API=${{ secrets.VITE_PROD_API }}" > .env.production

      # ------------------------------------------
      # Build
      # ------------------------------------------
      - name: Build Application
        run: npm run build

      # ------------------------------------------
      # Verify build
      # ------------------------------------------
      - name: Verify Build
        run: |
          echo "Checking frontend build..."

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi

          echo "Frontend build successful."
          echo "Build contents:"
          ls -lah dist

      # ------------------------------------------
      # Create deployment package
      # ------------------------------------------
      - name: Create Deployment Package
        run: |
          echo "Creating deployment package..."

          tar -czf qobo1live-frontend.tar.gz -C dist .

          echo "Deployment package:"
          ls -lh qobo1live-frontend.tar.gz

      # ------------------------------------------
      # Test VPS SSH connectivity
      # ------------------------------------------
      - name: Test VPS SSH Connectivity
        run: |
          echo "Testing connectivity to VPS..."
          echo "Port: 22"

          timeout 15 bash -c '</dev/tcp/${{ secrets.VPS_HOST }}/22' \
            && echo "VPS port 22 is reachable from GitHub Runner" \
            || (
              echo "ERROR: VPS port 22 is NOT reachable from GitHub Runner"
              exit 1
            )

      # ------------------------------------------
      # Prepare deployment directory
      # ------------------------------------------
      - name: Prepare VPS Deployment Directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          script: |
            set -e

            mkdir -p /home/ubuntu/deploy-temp
            chmod 755 /home/ubuntu/deploy-temp

            echo "Deployment directory ready:"
            ls -ld /home/ubuntu/deploy-temp

      # ------------------------------------------
      # Upload frontend package
      # ------------------------------------------
      - name: Upload Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: qobo1live-frontend.tar.gz
          target: /home/ubuntu/deploy-temp
          timeout: 30s
          command_timeout: 10m
          overwrite: true

      # ------------------------------------------
      # Deploy frontend
      # ------------------------------------------
      - name: Deploy Frontend on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            echo "=========================================="
            echo "Starting Qobo1live Production Frontend Deployment"
            echo "=========================================="

            DEPLOY_PACKAGE="/home/ubuntu/deploy-temp/qobo1live-frontend.tar.gz"

            echo "Creating deployment directories..."

            mkdir -p /var/www/qobo1live/releases

            RELEASE_ID=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR="/var/www/qobo1live/releases/$RELEASE_ID"

            echo "Release ID: $RELEASE_ID"
            echo "Release directory: $RELEASE_DIR"

            mkdir -p "$RELEASE_DIR"

            # ------------------------------------------
            # Verify package
            # ------------------------------------------
            echo "Checking uploaded package..."

            if [ ! -f "$DEPLOY_PACKAGE" ]; then
              echo "ERROR: Deployment package not found!"
              echo "Expected: $DEPLOY_PACKAGE"
              echo "Directory contents:"
              ls -lah /home/ubuntu/deploy-temp || true
              exit 1
            fi

            echo "Deployment package found:"
            ls -lh "$DEPLOY_PACKAGE"

            # ------------------------------------------
            # Extract frontend
            # ------------------------------------------
            echo "Extracting frontend..."

            tar -xzf "$DEPLOY_PACKAGE" -C "$RELEASE_DIR"

            # ------------------------------------------
            # Verify deployment
            # ------------------------------------------
            echo "Verifying deployed files..."

            if [ ! -f "$RELEASE_DIR/index.html" ]; then
              echo "ERROR: index.html not found after extraction!"
              exit 1
            fi

            echo "Frontend files:"
            ls -lah "$RELEASE_DIR"

            # ------------------------------------------
            # Update current release
            # ------------------------------------------
            echo "Updating current release..."

            rm -rf /var/www/qobo1live/current
            ln -s "$RELEASE_DIR" /var/www/qobo1live/current

            # ------------------------------------------
            # Permissions
            # ------------------------------------------
            echo "Setting permissions..."

            chown -R www-data:www-data "$RELEASE_DIR"

            # ------------------------------------------
            # Remove uploaded package
            # ------------------------------------------
            echo "Removing deployment package..."

            rm -f "$DEPLOY_PACKAGE"

            # ------------------------------------------
            # Clean old releases
            # ------------------------------------------
            echo "Cleaning old releases..."

            cd /var/www/qobo1live/releases

            ls -1dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf

            # ------------------------------------------
            # Nginx validation
            # ------------------------------------------
            echo "Testing Nginx configuration..."

            sudo nginx -t

            # ------------------------------------------
            # Reload Nginx
            # ------------------------------------------
            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            echo "=========================================="
            echo "Production frontend deployment completed"
            echo "=========================================="

            echo "Current frontend release:"
            readlink -f /var/www/qobo1live/current

            echo "=========================================="
