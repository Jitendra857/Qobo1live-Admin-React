<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
    <filter id="dragonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="220" fill="#219EBC" opacity="0.1"/>

  <!-- Golden Dragon Body Path -->
  <path d="M 120 380 C 80 280 180 180 250 220 C 320 260 400 160 360 80 C 420 140 380 280 280 280 C 180 280 160 380 120 380 Z" fill="url(#dragonGold)" filter="url(#dragonGlow)"/>

  <!-- Dragon Head & Horns -->
  <path d="M 360 80 L 410 50 L 390 90 L 430 80 L 380 120 Z" fill="#FFE066"/>
  <circle cx="375" cy="85" r="6" fill="#D00000"/>

  <text x="250" y="450" font-family="sans-serif" font-size="24" font-weight="900" fill="#FFB703" text-anchor="middle" filter="url(#dragonGlow)">GOLDEN DRAGON</text>
</svg>
