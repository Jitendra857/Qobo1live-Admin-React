<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1A103C"/>
      <stop offset="100%" stop-color="#05030A"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Horizon -->
  <g opacity="0.4">
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FF007F" stroke-width="4"/>
    <line x1="0" y1="640" x2="1920" y2="640" stroke="#FF007F" stroke-width="3"/>
    <line x1="0" y1="760" x2="1920" y2="760" stroke="#FF007F" stroke-width="2"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="#FF007F" stroke-width="1"/>
    
    <line x1="960" y1="540" x2="0" y2="1080" stroke="#00F2FE" stroke-width="3"/>
    <line x1="960" y1="540" x2="480" y2="1080" stroke="#00F2FE" stroke-width="3"/>
    <line x1="960" y1="540" x2="960" y2="1080" stroke="#00F2FE" stroke-width="3"/>
    <line x1="960" y1="540" x2="1440" y2="1080" stroke="#00F2FE" stroke-width="3"/>
    <line x1="960" y1="540" x2="1920" y2="1080" stroke="#00F2FE" stroke-width="3"/>
  </g>

  <!-- Glowing Neon Sun -->
  <circle cx="960" cy="500" r="180" fill="url(#gridGrad)"/>
  
  <!-- Ambient Stage Lights -->
  <circle cx="200" cy="200" r="300" fill="#00F2FE" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1720" cy="200" r="300" fill="#FF007F" opacity="0.15" filter="blur(60px)"/>
</svg>
