<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Glowing Aura -->
  <circle cx="250" cy="250" r="230" fill="url(#glow)" />

  <!-- Outer Golden Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="16" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="198" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Inner Transparent Window Cutout Guide -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Crown Top Emblem -->
  <g transform="translate(190, 15) scale(0.6)" filter="url(#shadow)">
    <path d="M 20 120 L 50 30 L 100 80 L 150 10 L 200 80 L 250 30 L 280 120 Z" fill="url(#goldGrad)" stroke="#FFF3B0" stroke-width="4"/>
    <circle cx="50" cy="30" r="12" fill="#FF2D55"/>
    <circle cx="150" cy="10" r="16" fill="#5856D6"/>
    <circle cx="250" cy="30" r="12" fill="#FF2D55"/>
    <circle cx="100" cy="80" r="8" fill="#34C759"/>
    <circle cx="200" cy="80" r="8" fill="#34C759"/>
  </g>

  <!-- Bottom Crest Badge -->
  <g transform="translate(200, 420) scale(0.5)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="60" rx="30" fill="url(#goldGrad)"/>
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#3A2500" text-anchor="middle">VIP KING</text>
  </g>
</svg>
