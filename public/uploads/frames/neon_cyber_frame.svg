<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0000FF"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#cyberGrad)" stroke-width="14" filter="url(#neonGlow)"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#neonPink)" stroke-width="6" stroke-dasharray="25 15" filter="url(#neonGlow)"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#00F2FE" stroke-width="3"/>

  <!-- Futuristic Corner Nodes -->
  <polygon points="250,20 270,40 230,40" fill="url(#neonPink)" filter="url(#neonGlow)"/>
  <polygon points="250,480 270,460 230,460" fill="url(#neonPink)" filter="url(#neonGlow)"/>
  <polygon points="20,250 40,230 40,270" fill="url(#cyberGrad)" filter="url(#neonGlow)"/>
  <polygon points="480,250 460,230 460,270" fill="url(#cyberGrad)" filter="url(#neonGlow)"/>
</svg>
