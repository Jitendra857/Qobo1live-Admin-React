<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4E50"/>
      <stop offset="50%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#fireGrad)" stroke-width="16" filter="url(#fireGlow)"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FF4E50" stroke-width="4"/>

  <!-- Dragon Fire Wings -->
  <path d="M 50 250 C 20 180 80 120 140 160 C 100 200 120 240 50 250 Z" fill="url(#fireGrad)" filter="url(#fireGlow)"/>
  <path d="M 450 250 C 480 180 420 120 360 160 C 400 200 380 240 450 250 Z" fill="url(#fireGrad)" filter="url(#fireGlow)"/>
  
  <text x="250" y="470" font-family="sans-serif" font-size="22" font-weight="900" fill="#F9D423" text-anchor="middle" filter="url(#fireGlow)">FIRE DRAGON</text>
</svg>
