  </defs>

  <rect width="1920" height="1080" fill="url(#royalGrad)"/>
  
  <!-- Royal Palace Pillars -->
  <rect x="100" y="0" width="120" height="1080" fill="#3D0052" opacity="0.8"/>
  <rect x="1700" y="0" width="120" height="1080" fill="#3D0052" opacity="0.8"/>

  <polygon points="960,0 760,1080 1160,1080" fill="url(#goldBeam)"/>

  <circle cx="960" cy="200" r="120" fill="#FFD700" opacity="0.2"/>
