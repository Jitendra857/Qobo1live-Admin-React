<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>
    <filter id="carGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FF416C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Car Chassis Body -->
  <path d="M 60 300 L 110 220 L 220 180 L 360 200 L 440 260 L 450 310 L 60 310 Z" fill="url(#carRed)" filter="url(#carGlow)"/>
  <!-- Windshield -->
  <path d="M 140 220 L 220 190 L 330 205 L 310 230 Z" fill="#00F2FE" opacity="0.8"/>
  
  <!-- Wheels -->
  <circle cx="140" cy="310" r="40" fill="#1A1A1A" stroke="#FF416C" stroke-width="6"/>
  <circle cx="140" cy="310" r="16" fill="#FFF"/>
  <circle cx="360" cy="310" r="40" fill="#1A1A1A" stroke="#FF416C" stroke-width="6"/>
  <circle cx="360" cy="310" r="16" fill="#FFF"/>

  <text x="250" y="420" font-family="sans-serif" font-size="24" font-weight="900" fill="#FF4B2B" text-anchor="middle">SUPER SPORTS CAR</text>
</svg>
